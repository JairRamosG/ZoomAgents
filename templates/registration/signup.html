{% extends "base_app.html" %}

{% block title %}Crear cuenta — ZoomAgents{% endblock %}

{% block content %}
  <h1 class="page-heading">Crear cuenta</h1>
  <div class="panel">
    <form method="post">
      {% csrf_token %}
      <div class="form-fields">
        {{ form.as_div }}
      </div>
      <button type="submit" class="btn-primary mt-4">Registrarse</button>
    </form>
    <p class="mt-4 text-sm">
      ¿Ya tenés cuenta? <a href="{% url 'login' %}" class="link">Iniciar sesión</a>
    </p>
  </div>
{% endblock %}

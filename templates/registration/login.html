{% extends "base_app.html" %}

{% block title %}Iniciar sesión — ZoomAgents{% endblock %}

{% block content %}
  <h1 class="page-heading">Iniciar sesión</h1>
  <div class="panel">
    <form method="post">
      {% csrf_token %}
      <div class="form-fields">
        {{ form.as_div }}
      </div>
      <button type="submit" class="btn-primary mt-4">Entrar</button>
    </form>
    <p class="mt-4 text-sm">
      ¿No tenés cuenta? <a href="{% url 'signup' %}" class="link">Crear cuenta</a>
    </p>
  </div>
{% endblock %}

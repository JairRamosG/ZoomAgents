[project]
name = "zoomagents"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "django>=6.0,<6.1",
    "psycopg[binary]>=3.3,<3.4",
    "gunicorn>=26.0,<27.0",
    "django-tasks-db>=0.12,<0.13",
    "openai>=2.46,<2.47",
    "dj-database-url>=3.1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<9.2",
    "pytest-django>=4.12,<4.13",
    "ruff>=0.15,<0.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["config"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings_test"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "PT"]

[tool.ruff.format]
quote-style = "double"
